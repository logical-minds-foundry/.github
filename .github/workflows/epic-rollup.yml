name: Epic Rollup

# Event-driven epic rollup (epic vergil-project/.github#75). When any issue in
# this repo closes, hand off to the reusable ops-epic-rollup workflow, which
# runs `vrg-epic-rollup` to close the parent epic once all its sibling tasks are
# closed. A no-op unless the closed issue is a managed task with a finite,
# non-standing epic parent, so it is safe to fire on every close (triage
# intake, ideas, and the epics themselves have no epic parent).
#
# This repo needs it too: every epic's retrospective task lives here, so the
# retrospective's merge is usually the close that should roll the epic up.
# Without this caller the epic waited for the daily Epic Sweep (#338; cf.
# vergil-project/.github#373). Thin caller per repo convention (cf.
# epic-sweep.yml / ops.yml).

on:
  issues:
    types: [closed]

permissions:
  contents: read

jobs:
  epic-rollup:
    uses: vergil-project/vergil-actions/.github/workflows/ops-epic-rollup.yml@v2.1
    permissions:
      contents: read
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
